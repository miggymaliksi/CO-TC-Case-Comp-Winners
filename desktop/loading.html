<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self'"
    />
    <title>Savor</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #f8f8f3;
        color: #264e39;
      }
      body {
        display: grid;
        place-items: center;
        text-align: center;
        font-family: -apple-system, sans-serif;
      }
      .logo {
        display: block;
        width: 260px;
        max-width: calc(100vw - 60px);
        height: auto;
        margin: 0 auto 24px;
      }
      p {
        font-size: 15px;
        line-height: 1.7;
      }
      small {
        display: block;
        color: #7c837a;
        margin-top: 12px;
      }
    </style>
  </head>
  <body>
    <main>
      <img class="logo" src="savor-logo.png" alt="Savor" />
      <p>Getting your pantry ready…</p>
      <small>Save Smart · Share More · Savor Better</small>
    </main>
  </body>
</html>
